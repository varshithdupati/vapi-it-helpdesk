name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build
        working-directory: ./server
        run: npm run build

      - name: Create deployment package
        run: |
          cd server
          tar -czf ../deploy-package.tar.gz \
            dist \
            prisma \
            package.json \
            package-lock.json \
            node_modules/.prisma

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-package.tar.gz"
          target: "/tmp"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Database is stored in /var/www/api/data/ to persist across deployments
            DB_DIR="/var/www/api/data"
            DB_PATH="$DB_DIR/prod.db"
            
            echo "Stopping existing process..."
            pm2 stop api 2>/dev/null || true
            
            echo "Ensuring data directory exists..."
            mkdir -p $DB_DIR
            
            echo "Extracting deployment package..."
            cd /var/www/api
            rm -rf dist prisma package.json package-lock.json
            tar -xzf /tmp/deploy-package.tar.gz
            rm /tmp/deploy-package.tar.gz
            
            echo "Installing production dependencies..."
            npm ci --omit=dev
            
            echo "Running database migrations..."
            DATABASE_URL="file:$DB_PATH" npx prisma migrate deploy
            
            echo "Checking database..."
            EMPLOYEE_COUNT=$(DATABASE_URL="file:$DB_PATH" node -e "
              const { PrismaClient } = require('@prisma/client');
              const prisma = new PrismaClient();
              prisma.employee.count().then(c => { console.log(c); prisma.\$disconnect(); });
            " 2>/dev/null || echo "0")
            
            echo "Found $EMPLOYEE_COUNT employees in database"
            
            if [ "$EMPLOYEE_COUNT" = "0" ]; then
              echo "Database is empty, seeding..."
              DATABASE_URL="file:$DB_PATH" node -e "
                const { PrismaClient } = require('@prisma/client');
                const prisma = new PrismaClient();
                
                async function seed() {
                  await prisma.employee.create({
                    data: {
                      id: '12345', name: 'Alex Johnson', department: 'Engineering',
                      devices: { create: [
                        { type: 'laptop', assetTag: 'L-9812', os: 'macOS 15' },
                        { type: 'phone', assetTag: 'P-4421', os: 'iOS 18' }
                      ]}
                    }
                  });
                  
                  await prisma.employee.create({
                    data: {
                      id: '67890', name: 'Priya Patel', department: 'Sales',
                      devices: { create: [
                        { type: 'laptop', assetTag: 'L-7741', os: 'Windows 11' }
                      ]}
                    }
                  });
                  
                  console.log('Seeding complete');
                }
                
                seed().catch(console.error).finally(() => prisma.\$disconnect());
              "
            else
              echo "Database has data, skipping seed"
            fi
            
            echo "Starting application..."
            NODE_ENV=production \
            DATABASE_URL="file:$DB_PATH" \
            PORT=3001 \
            pm2 start dist/src/main.js --name api --update-env
            
            pm2 save
            
            echo "Deployment complete!"
