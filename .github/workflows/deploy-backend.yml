name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build
        working-directory: ./server
        run: npm run build

      - name: Create deployment package
        run: |
          cd server
          tar -czf ../deploy-package.tar.gz \
            dist \
            prisma \
            package.json \
            package-lock.json \
            node_modules/.prisma

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-package.tar.gz"
          target: "/tmp"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            echo "Stopping existing process..."
            pm2 stop api 2>/dev/null || true
            
            echo "Extracting deployment package..."
            cd /var/www/api
            rm -rf dist prisma package.json package-lock.json
            tar -xzf /tmp/deploy-package.tar.gz
            rm /tmp/deploy-package.tar.gz
            
            echo "Installing production dependencies..."
            npm ci --omit=dev
            
            echo "Running database migrations..."
            DATABASE_URL="file:./prod.db" npx prisma migrate deploy
            
            echo "Starting application..."
            NODE_ENV=production \
            DATABASE_URL="file:./prod.db" \
            PORT=3001 \
            pm2 start dist/src/main.js --name api --update-env
            
            pm2 save
            
            echo "Deployment complete!"
