name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build
        working-directory: ./server
        run: npm run build

      - name: Create deployment package
        run: |
          cd server
          tar -czf ../deploy-package.tar.gz \
            dist \
            prisma \
            package.json \
            package-lock.json \
            node_modules/.prisma

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-package.tar.gz"
          target: "/tmp"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Stop existing process
            pm2 stop api 2>/dev/null || true
            
            # Extract package
            cd /var/www/api
            rm -rf dist prisma package.json package-lock.json
            tar -xzf /tmp/deploy-package.tar.gz
            rm /tmp/deploy-package.tar.gz
            
            # Install production dependencies
            npm ci --omit=dev
            
            # Copy Prisma client
            cp -r node_modules/.prisma node_modules/ 2>/dev/null || true
            
            # Run migrations
            DATABASE_URL="file:./prod.db" npx prisma migrate deploy
            
            # Seed if first deployment (ignore errors if already seeded)
            DATABASE_URL="file:./prod.db" npx prisma db seed 2>/dev/null || true
            
            # Start/restart with PM2 (NestJS outputs to dist/src/main.js)
            DATABASE_URL="file:./prod.db" PORT=3001 pm2 start dist/src/main.js --name api --update-env
            
            # Save PM2 config
            pm2 save
            
            echo "✅ Backend deployed successfully!"

